</script><script src="page-editor.js"></script><script src="assets/page-flip.browser.js"></script><script>
const shell=document.querySelector('.flipbook-shell');
// StPageFlip switches to a two-page spread when width >= 2 * minWidth.
// This lookbook is always a single portrait sheet, including during resize.
const portraitMinimum=()=>Math.floor(shell.getBoundingClientRect().width/2)+1;
const book=new St.PageFlip(document.querySelector('#flipbook'),{width:433,height:650,size:'stretch',minWidth:portraitMinimum(),maxWidth:680,minHeight:240,maxHeight:1020,drawShadow:true,maxShadowOpacity:.18,flippingTime:500,usePortrait:true,startZIndex:1,autoSize:false,showCover:false,showPageCorners:false,mobileScrollSupport:false,swipeDistance:18,disableFlipByClick:true});
document.querySelectorAll('#flipbook .page:not(.front-page) img').forEach(img=>{img.loading='lazy';img.decoding='async'});
book.loadFromHTML(document.querySelectorAll('#flipbook > .page'));
let photoInvitationPlayed=false;
book.on('flip',event=>{if(event.data!==2||photoInvitationPlayed)return;photoInvitationPlayed=true;document.querySelector('.album-page').classList.add('album-revealed')});
book.on('flip',event=>document.querySelector('.oceana-page').classList.toggle('oceana-visible',event.data===4));
book.on('flip',event=>trayPage.classList.toggle('tray-arrived',event.data===6));
book.on('flip',event=>lovePage.classList.toggle('love-visible',event.data===7));
let loveInvitationPlayed=false;
book.on('flip',event=>{if(event.data!==7||loveInvitationPlayed)return;loveInvitationPlayed=true;lovePage.classList.add('love-revealed')});
book.on('flip',event=>keepsakePage.classList.toggle('keepsake-visible',event.data===8));
book.on('flip',event=>forestPage.classList.toggle('forest-visible',event.data===5));
book.on('flip',event=>receiptPage.classList.toggle('receipt-visible',event.data===9));
const flipHint=document.querySelector('.flip-hint');
book.on('flip',event=>{flipHint.hidden=event.data===9});
const studioVideo=studioPage.querySelector('.studio-video'),studioPlay=studioPage.querySelector('.studio-play');
studioPlay.addEventListener('click',()=>{if(document.body.classList.contains('editing'))return;studioVideo.muted=true;studioVideo.play();studioPlay.hidden=true});
studioVideo.addEventListener('click',()=>{if(studioVideo.paused)studioVideo.play();else studioVideo.pause()});
studioVideo.addEventListener('pause',()=>{studioPlay.hidden=false});studioVideo.addEventListener('ended',()=>{studioPlay.hidden=false});
studioVideo.addEventListener('playing',()=>{studioPlay.hidden=true});
book.on('flip',event=>{if(event.data===1){studioVideo.muted=true;studioVideo.play().catch(()=>{studioPlay.hidden=false})}else{studioVideo.pause();studioVideo.currentTime=0}});
new ResizeObserver(()=>{const minimum=portraitMinimum();if(book.getSettings().minWidth!==minimum){book.getSettings().minWidth=minimum;book.update()}}).observe(shell);
const flipSurface=document.querySelector('#flipbook');
// Own corner touches from start to finish: the library's delayed touch-start
// and the old release fallback otherwise race and can leave a folded page stuck.
let cornerGesture=null;
function localTouch(touch){const r=flipSurface.querySelector('.stf__block').getBoundingClientRect();return{x:touch.clientX-r.left,y:touch.clientY-r.top}}
flipSurface.addEventListener('touchstart',event=>{
  if(document.body.classList.contains('editing')||event.touches.length!==1||book.getState()!=='read')return;
  if(event.target.closest('.photo,.love-photo,.forest-note,.archive-polaroid,video,.studio-play,.editbar,dialog'))return;
  const t=event.touches[0],r=flipSurface.getBoundingClientRect();
  if(t.clientX<r.left+r.width*.60||t.clientY>r.top+r.height*.28)return;
  event.preventDefault();event.stopImmediatePropagation();
  cornerGesture={id:t.identifier,startX:t.clientX,startY:t.clientY,moved:false};
  book.startUserTouch(localTouch(t));
},{capture:true,passive:false});
window.addEventListener('touchmove',event=>{
  if(!cornerGesture)return;
  const t=[...event.touches].find(t=>t.identifier===cornerGesture.id);if(!t)return;
  event.preventDefault();event.stopImmediatePropagation();
  if(Math.hypot(t.clientX-cornerGesture.startX,t.clientY-cornerGesture.startY)>5)cornerGesture.moved=true;
  book.userMove(localTouch(t),true);
},{capture:true,passive:false});
function finishCorner(event){
  if(!cornerGesture)return;
  const t=[...event.changedTouches].find(t=>t.identifier===cornerGesture.id);if(!t)return;
  event.preventDefault();event.stopImmediatePropagation();
  const g=cornerGesture;cornerGesture=null;
  const controller=book.getFlipController(),calculation=controller.getCalculation();
  const draggedLeft=g.startX-t.clientX>Math.max(24,flipSurface.getBoundingClientRect().width*.08);
  book.userStop(localTouch(t),true);
  if(!calculation)return;
  const bounds=book.getBoundsRect();
  const corner=calculation.getCorner()==='bottom'?bounds.height:0;
  if(g.moved&&draggedLeft&&event.type!=='touchcancel'){
    controller.setState('flipping');
    controller.animateFlippingTo(calculation.getPosition(),{x:-bounds.pageWidth,y:corner},true);
  }else controller.animateFlippingTo(calculation.getPosition(),{x:bounds.pageWidth,y:corner},false);
}
window.addEventListener('touchend',finishCorner,{capture:true,passive:false});
window.addEventListener('touchcancel',finishCorner,{capture:true,passive:false});
const photoDialog=document.querySelector('#photo-dialog');
function openPhoto(button){
  if(!button||document.body.classList.contains('editing'))return;
  const photos=[...button.closest('.page').querySelectorAll('.photo, .love-photo')],index=photos.indexOf(button),source=button.querySelector('img');
  const upright=button.classList.contains('forest-note')?'assets/forest-essence-note-upright.png':button.classList.contains('archive-polaroid')?'assets/archive-polaroid-upright.png':source.src;
  photoDialog.querySelector('img').src=upright;photoDialog.querySelector('img').alt=source.alt;
  photoDialog.querySelector('img').style.transform='none';
  const loveNames=['Amethyst','Garnet','Peridot','Ruby'];
  photoDialog.querySelector('p').textContent=button.classList.contains('forest-note')?'Forest Essence':button.classList.contains('archive-polaroid')?'Nymphéas Studio':button.classList.contains('love-photo')&&index<4?`${index+1}. ${loveNames[index]}`:`Nymphéas Studio · ${String(index+1).padStart(2,'0')}`;
  if(typeof photoDialog.showModal==='function')photoDialog.showModal();else photoDialog.setAttribute('open','');
}
document.addEventListener('click',event=>{
  const button=event.target.closest('.album-page .photo, .love-page .love-photo, .forest-page .forest-note, .archive-page .archive-polaroid');if(!button||document.body.classList.contains('editing'))return;
  event.preventDefault();event.stopPropagation();
  openPhoto(button);
},true);
let photoTouch=null;
document.addEventListener('touchstart',event=>{
  const button=event.target.closest('.album-page .photo, .love-page .love-photo, .forest-page .forest-note, .archive-page .archive-polaroid');if(!button||event.touches.length!==1||document.body.classList.contains('editing'))return;
  const t=event.touches[0];photoTouch={button,id:t.identifier,x:t.clientX,y:t.clientY,moved:false};
  event.stopImmediatePropagation();
},{capture:true,passive:true});
document.addEventListener('touchmove',event=>{
  if(!photoTouch)return;const t=[...event.touches].find(t=>t.identifier===photoTouch.id);if(!t)return;
  if(Math.hypot(t.clientX-photoTouch.x,t.clientY-photoTouch.y)>8)photoTouch.moved=true;
  event.stopImmediatePropagation();
},{capture:true,passive:true});
document.addEventListener('touchend',event=>{
  if(!photoTouch)return;const t=[...event.changedTouches].find(t=>t.identifier===photoTouch.id);if(!t)return;
  const candidate=photoTouch;photoTouch=null;event.preventDefault();event.stopImmediatePropagation();
  if(!candidate.moved)openPhoto(candidate.button);
},{capture:true,passive:false});
document.addEventListener('touchcancel',()=>{photoTouch=null},{capture:true});
document.addEventListener('keydown',event=>{const zoomable=event.target.closest('.forest-note,.archive-polaroid');if(!zoomable||!['Enter',' '].includes(event.key)||document.body.classList.contains('editing'))return;event.preventDefault();openPhoto(zoomable)});
photoDialog.querySelector('.close-photo').addEventListener('click',()=>photoDialog.close());photoDialog.addEventListener('click',e=>{if(e.target===photoDialog)photoDialog.close()});
document.addEventListener('keydown',event=>{if(event.key==='ArrowRight'&&!document.body.classList.contains('editing'))book.flipNext('top')});
</script></body></html>
